<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3eee1">
<meta name="description" content="BioNyssa: un desecho que nace. Aprende, juega y forma parte de la comunidad.">
<title>Memorama verde | BioNyssa</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="BioNyssa">
<meta property="og:locale" content="es_MX">
<meta property="og:title" content="Memorama verde | BioNyssa">
<meta property="og:description" content="La bolsa que no termina en la basura: la plantas y se vuelve planta.">
<meta property="og:image" content="https://bionyssa.netlify.app/assets/img/logo-app.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" href="assets/img/logo-app.png">
<link rel="apple-touch-icon" href="assets/img/logo-app.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-minijuegos-y-juegos.css">
<link rel="stylesheet" href="css/03-comun-parte-1.css">
<link rel="stylesheet" href="css/05-comun-parte-2.css">
<link rel="stylesheet" href="css/06-barra-y-adaptacion-a-pantallas.css">
<link rel="stylesheet" href="css/09-ajustes-juegos-y-planta.css">
<script src="js/tema-inicial.js"></script>
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="screen pantalla-juego">

  <div class="topbar">
    <div class="wrap">
      <div class="topbar-row">
        <a href="minijuegos.html" class="back-btn" aria-label="Volver a minijuegos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><g stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15.8 4.9c-2.9 2.3-5.2 4.6-6.9 7.2 1.9 2.7 4.3 4.9 7 6.9"/></g></svg>
        </a>
        <a href="minijuegos.html" class="mark" aria-label="BioNyssa, ir a minijuegos"><span class="mark-icon" aria-hidden="true"></span><span class="mark-word">BioNyssa</span></a>
      </div>
    </div>
  </div>

  <main id="contenido" class="page-main">
    <div class="wrap">

      <header class="page-head">
        <h1>Memorama verde</h1>
        <p>Memoria y residuos</p>
      </header>

      <div class="game-hero">
        <div class="game-hero-mascot"><img loading="lazy" decoding="async" src="assets/img/mascota.webp" alt="Mascota de BioNyssa" width="68" height="68"></div>
        <div class="game-hero-text">
          <p class="game-hero-tag">Voltea las cartas de dos en dos y encuentra los cinco residuos repetidos.</p>
        </div>
      </div>

      <p class="center mt-24">
        <button type="button" class="tuto-link" id="abrirTutorial">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.3c4.8 0 8.7 3.9 8.6 8.7-.1 4.7-3.9 8.7-8.7 8.6-4.7-.1-8.6-3.9-8.5-8.7.1-4.7 3.9-8.6 8.6-8.6z"/><path d="M9.6 9.6c.2-1.5 1.3-2.3 2.6-2.3 1.4 0 2.4.9 2.4 2.1 0 1.8-2.4 2-2.4 3.9M12.1 16.6v.1"/></g></svg>
          ¿Cómo se juega?
        </button>
      </p>

      <div class="mem-stats mt-24">
        <div><strong id="movs">0</strong><span>Movimientos</span></div>
        <div><strong id="tiempo">0:00</strong><span>Tiempo</span></div>
        <div><strong id="pares">0/5</strong><span>Pares</span></div>
      </div>

      <div class="quiz-stage stage-mem" id="etapaJuego">
        <div class="tablero" id="tablero" aria-label="Tablero del memorama"></div>

        <div class="dato" id="dato" aria-live="polite">
          <div class="dato-cuerpo">
            <strong id="datoTitulo"></strong>
            <span id="datoTexto"></span>
          </div>
        </div>

        <div class="quiz-track"><i id="barraProg"></i></div>
        <p class="quiz-progress" id="progreso">Toca una carta para empezar</p>
      </div>

      <div class="quiz-stage" id="etapaResultado" style="display:none;">
        <div class="result-panel">
          <div class="result-icon" id="iconoResultado"></div>
          <h2 id="tituloResultado">¡Memorama completo!</h2>
          <p id="textoResultado"></p>
          <div class="res-stats" id="resStats"></div>
          <p class="aviso-record" id="avisoRecord" hidden>Nuevo récord de movimientos</p>
          <div class="stack mt-24">
            <button type="button" class="btn btn-primary" id="btnReintentar">Jugar de nuevo</button>
            <a href="minijuegos.html" class="btn btn-outline">Volver a minijuegos</a>
          </div>
        </div>
      </div>

    </div>
  </main>

</div>

<script src="js/almacen-por-cuenta.js"></script>
<script src="js/comun.js"></script>
<script src="js/avisos.js"></script>
<script src="js/efectos.js"></script>
<script src="js/puntos.js"></script>
<script src="js/retos.js"></script>
<script src="js/sesion.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-cuenta.js"></script>
<script src="js/nube-firestore.js"></script>
<script src="js/sin-conexion.js"></script>
<script src="js/juegos-base.js"></script>
<script src="js/juego-memorama-verde.js"></script>
<script src="js/transiciones-de-pagina.js"></script>
<script src="js/analiticas.js" defer></script>
<script src="js/animaciones.js"></script>
</body>
</html>
