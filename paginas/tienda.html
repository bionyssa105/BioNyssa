<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="screen">
  <div class="topbar">
    <div class="wrap">
      <div class="topbar-row">
        <a href="menu.html" class="back-btn" aria-label="Volver al menú">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><g stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15.8 4.9c-2.9 2.3-5.2 4.6-6.9 7.2 1.9 2.7 4.3 4.9 7 6.9"/></g></svg>
        </a>
        <a href="../index.html" class="mark" aria-label="BioNyssa, ir al inicio"><span class="mark-icon" aria-hidden="true"></span><span class="mark-word">BioNyssa</span></a>
      </div>
    </div>
  </div>
  <main id="contenido" class="page-main">
    <div class="wrap">
      <header class="page-head"><h1>Tienda</h1><p>Elige tu bolsa, el material y las semillas que quieres sembrar.</p></header>
      <div class="tienda-grid" id="tProductos"></div>
      <section class="pedido" aria-labelledby="tPedido">
        <h2 id="tPedido" class="c-tit">Tu pedido <span id="tCuenta"></span></h2>
        <div class="pedido-cols">
          <div class="pedido-lista" id="tLista" aria-live="polite"></div>
          <form id="formPedido" class="c-form" novalidate>
            <h3 class="c-tit">Tus datos</h3>
            <div class="field-group"><label class="field-label" for="tNombre">Tu nombre</label><div class="field-input-wrap sin-icono"><input type="text" id="tNombre" maxlength="80" autocomplete="name" placeholder="Como te llamas"></div></div>
            <div class="field-group"><label class="field-label" for="tCorreo">Tu correo</label><div class="field-input-wrap sin-icono"><input type="email" id="tCorreo" maxlength="120" autocomplete="email" placeholder="tucorreo@ejemplo.com"></div></div>
            <div class="field-group"><label class="field-label" for="tTel">Teléfono (opcional)</label><div class="field-input-wrap sin-icono"><input type="tel" id="tTel" maxlength="20" autocomplete="tel" placeholder="10 dígitos"></div></div>
            <div class="field-group"><label class="field-label" for="tNotas">Dirección o notas de entrega</label><textarea id="tNotas" rows="3" maxlength="300" placeholder="Calle, colonia, ciudad o lo que quieras avisarnos"></textarea><span class="c-cuenta" id="tNotasCuenta" aria-live="off">0 / 300</span></div>
            <input type="text" id="tWeb" tabindex="-1" autocomplete="off" class="c-trampa" aria-hidden="true">
            <button type="submit" class="btn btn-primary" id="tEnviar" disabled>Hacer pedido</button>
            <p class="c-estado" id="tEstado" role="status" aria-live="polite"></p>
            <p class="pedido-nota">Aquí no se paga: te escribimos al correo para confirmar tu pedido, el pago y la entrega.</p>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="../js/almacen-por-cuenta.js"></script>
<script src="../js/nucleo.js"></script>
<script src="../js/firebase-base.js"></script>
<script src="../js/pagina-tienda.js"></script>
<script src="../js/cierre.js"></script>
</body>
</html>
